services:
  auth-api:
    build:
      context: ./auth-api
      target: production
    ports:
      - "8081:8080"
    env_file:
      - ./auth-api/.env
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: auth
      SPRING_ENV: dev
    networks:
      - fullstack_network
    depends_on:
      db:
        condition: service_healthy

  users-api:
    build:
      context: ./users-api
      target: production
    ports:
      - "8082:8080"
    env_file:
      - ./users-api/.env
