services:
  auth-api:
    build:
      context: ./auth-api
      target: production
    ports:
      - "8000:8080"
    environment:
      SPRING_APP_NAME: auth-api
      HOST_PORT: 8080
      HOST_DB_PORT: 3306
      SPRING_ENV: dev
      SPRING_LOG_LEVEL: WARN
      SPRING_JWT_SECRET: secret-key
      SPRING_JWT_PUBLIC: /v3/api-docs/**,/swagger-ui/**
      SPRING_JWT_ISSUER: login-service
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: auth
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      SPRING_JWT_EXPIRATION: 86400000
    networks:
      - fullstack_network
    depends_on:
      db:
        condition: service_healthy

