  vet-manager-api:
    build:
      context: ./vet-manager-api
      target: production
    ports:
      - "8092:8080"
    env_file:
      - ./vet-manager-api/.env
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: vet_manager
      SPRING_ENV: dev
    networks:
      - fullstack_network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:lts
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - global_mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - fullstack_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15m
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8099:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    networks:
      - fullstack_network
    depends_on:
      db:
        condition: service_healthy

volumes:
  global_mysql_data:

networks:
  fullstack_network:
    name: fullstack_network
