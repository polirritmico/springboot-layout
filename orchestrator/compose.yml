x-common-env: &common-env
  HOST_DB_PORT: 3306
  MYSQL_HOST: db
  MYSQL_PASSWORD: password
  MYSQL_USER: user
  SPRING_ENV: dev
  SPRING_JWT_ISSUER: login-service
  SPRING_JWT_PUBLIC: /v3/api-docs/**,/swagger-ui/**
  SPRING_JWT_SECRET: secret-key
  SPRING_LOG_LEVEL: WARN

services:
  auth-api:
    build:
      context: ./auth-api
      target: production
    ports:
      - "8000:8080"
    environment:
      <<: *common-env
      HOST_PORT: 8080
      MYSQL_DATABASE: auth
      SPRING_APP_NAME: auth-api
      SPRING_JWT_EXPIRATION: 86400000
      SPRING_JWT_PUBLIC: /api/v1/health,/api/v1/auth,/v3/api-docs/**,/swagger-ui/**
    networks:
      - fullstack_network
    depends_on:
      db:
        condition: service_healthy

  appointments-api:
    build:
      context: ./appointments-api
      target: production
    ports:
      - "8001:8080"
    environment:
      <<: *common-env
      HOST_PORT: 8080
      MYSQL_DATABASE: appointments
      SPRING_APP_NAME: appointments-api
    networks:
      - fullstack_network
    depends_on:
      db:
        condition: service_healthy

  pets-api:
    build:
      context: ./pets-api
      target: production
    ports:
      - "8002:8080"
    environment:
      <<: *common-env
      HOST_PORT: 8080
      MYSQL_DATABASE: pets
      SPRING_APP_NAME: pets-api
    networks:
      - fullstack_network
    depends_on:
      db:
        condition: service_healthy

  vets-api:
    build:
      context: ./vets-api
      target: production
    ports:
      - "8003:8080"
    environment:
      <<: *common-env
      HOST_PORT: 8080
      MYSQL_DATABASE: vets
      SPRING_APP_NAME: vets-api
    networks:
      - fullstack_network
    depends_on:
      db:
        condition: service_healthy

  vet-manager-api:
    build:
      context: ./vet-manager-api
      target: production
    ports:
      - "8004:8080"
    environment:
      <<: *common-env
      HOST_PORT: 8080
      SPRING_APP_NAME: vet-manager-api
      SPRING_JWT_PUBLIC: /appointments/v3/api-docs,/pets/v3/api-docs,/vets/v3/api-docs,/v3/api-docs/**,/swagger-ui/**
      SERVICE_APPOINTMENTS_BASE_URL: http://appointments-api:8080
      SERVICE_PETS_BASE_URL: http://pets-api:8080
      SERVICE_VETS_BASE_URL: http://vets-api:8080
    networks:
      - fullstack_network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:lts
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - global_mysql_data:/var/lib/mysql
      - mysql_init_volume:/docker-entrypoint-initdb.d
    networks:
      - fullstack_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15m
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8088:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    networks:
      - fullstack_network
    depends_on:
      db:
        condition: service_healthy

volumes:
  global_mysql_data:
  mysql_init_volume:
    name: mysql_init_volume

networks:
  fullstack_network:
    name: fullstack_network
