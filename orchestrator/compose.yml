x-common-env: &common-env
  HOST_DB_PORT: 3306
  MYSQL_HOST: db
  MYSQL_PASSWORD: password
  MYSQL_USER: user

  SPRING_ENV: dev
  SPRING_JWT_ISSUER: login-service
  SPRING_JWT_PUBLIC: /v3/api-docs/**,/swagger-ui/**,/actuator/**
  SPRING_JWT_SECRET: secret-key
  SPRING_LOG_LEVEL: WARN
  SPRING_EUREKA_URL: http://eureka-server:8123/eureka

  SERVICE_INVOICES_BASE_URL: lb://InvoicesMicroservice-dev
  SERVICE_SALES_BASE_URL: lb://SalesMicroservice-dev
  SERVICE_CARTS_BASE_URL: lb://CartsMicroservice-dev
  SERVICE_PRODUCTS_BASE_URL: lb://ProductsMicroservice-dev
  SERVICE_APPOINTMENTS_BASE_URL: lb://AppointmentsMicroservice-dev
  SERVICE_PETS_BASE_URL: lb://PetsMicroservice-dev
  SERVICE_VETS_BASE_URL: lb://VetsMicroservice-dev

services:
  eureka-server:
    build:
      context: ./eureka-server
    ports:
      - "8123:8123"
    environment:
      <<: *common-env
      SPRING_APP_NAME: Eureka-Server
      HOST_PORT: 8123
    networks:
      - fullstack_network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8123/actuator/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      SPRING_APP_NAME: ApiGateway
      HOST_PORT: 8080
      SERVICE_AUTH_ID: AuthMicroservice-dev
      SERVICE_ACCOUNTING_MANAGER_ID: AccountingManager-dev
      SERVICE_STORE_MANAGER_ID: StoreManager-dev
      SERVICE_VET_MANAGER_ID: VetManager-dev
    networks:
      - fullstack_network
    depends_on:
      eureka-server:
        condition: service_healthy

  auth-api:
    build:
      context: ./auth-api
      target: production
    ports:
      - "8000:8080"
    environment:
      <<: *common-env
      HOST_PORT: 8080
      MYSQL_DATABASE: auth
      SPRING_APP_NAME: AuthMicroservice
      SPRING_JWT_EXPIRATION: 86400000
      SPRING_JWT_PUBLIC: /api/v1/health,/v3/api-docs/**,/swagger-ui/**,/actuator/**
    networks:
      - fullstack_network
    depends_on:
      eureka-server:
        condition: service_healthy
      db:
        condition: service_healthy

  users-api:
    build:
      context: ./users-api
      target: production
    ports:
      - "8001:8080"
    environment:
      <<: *common-env
      HOST_PORT: 8080
      MYSQL_DATABASE: users
      SPRING_APP_NAME: UsersMicroservice
    networks:
      - fullstack_network
    depends_on:
      eureka-server:
        condition: service_healthy
      db:
        condition: service_healthy

  sales-api:
    build:
      context: ./sales-api
      target: production
    ports:
      - "8002:8080"
    environment:
      <<: *common-env
      HOST_PORT: 8080
      MYSQL_DATABASE: sales
      SPRING_APP_NAME: SalesMicroservice
    networks:
      - fullstack_network
    depends_on:
      eureka-server:
        condition: service_healthy
      db:
        condition: service_healthy

  invoice-api:
    build:
      context: ./invoice-api
      target: production
    ports:
      - "8003:8080"
    environment:
      <<: *common-env
      HOST_PORT: 8080
      MYSQL_DATABASE: invoice
      SPRING_APP_NAME: InvoicesMicroservice
    networks:
      - fullstack_network
    depends_on:
      eureka-server:
        condition: service_healthy
      db:
        condition: service_healthy

  carts-api:
    build:
      context: ./carts-api
      target: production
    ports:
      - "8004:8080"
    environment:
      <<: *common-env
      HOST_PORT: 8080
      MYSQL_DATABASE: carts
      SPRING_APP_NAME: CartsMicroservice
    networks:
      - fullstack_network
    depends_on:
      eureka-server:
        condition: service_healthy
      db:
        condition: service_healthy

  product-api:
    build:
      context: ./product-api
      target: production
    ports:
      - "8005:8080"
    environment:
      <<: *common-env
      HOST_PORT: 8080
      MYSQL_DATABASE: product
      SPRING_APP_NAME: ProductsMicroservice
    networks:
      - fullstack_network
    depends_on:
      eureka-server:
        condition: service_healthy
      db:
        condition: service_healthy

  pets-api:
    build:
      context: ./pets-api
      target: production
    ports:
      - "8006:8080"
    environment:
      <<: *common-env
      HOST_PORT: 8080
      MYSQL_DATABASE: pets
      SPRING_APP_NAME: PetsMicroservice
    networks:
      - fullstack_network
    depends_on:
      eureka-server:
        condition: service_healthy
      db:
        condition: service_healthy

  appointments-api:
    build:
      context: ./appointments-api
      target: production
    ports:
      - "8007:8080"
    environment:
      <<: *common-env
      HOST_PORT: 8080
      MYSQL_DATABASE: appointments
      SPRING_APP_NAME: AppointmentsMicroservice
    networks:
      - fullstack_network
    depends_on:
      eureka-server:
        condition: service_healthy
      db:
        condition: service_healthy

  vets-api:
    build:
      context: ./vets-api
      target: production
    ports:
      - "8008:8080"
    environment:
      <<: *common-env
      HOST_PORT: 8080
      MYSQL_DATABASE: vets
      SPRING_APP_NAME: VetsMicroservice
    networks:
      - fullstack_network
    depends_on:
      eureka-server:
        condition: service_healthy
      db:
        condition: service_healthy

  store-manager-api:
    build:
      context: ./store-manager-api
      target: production
    ports:
      - "8009:8080"
    environment:
      <<: *common-env
      HOST_PORT: 8080
      MYSQL_DATABASE: store_manager
      SPRING_APP_NAME: StoreManager
      SPRING_JWT_PUBLIC: /carts/v3/api-docs,/products/v3/api-docs,/v3/api-docs/**,/swagger-ui/**,/actuator/**
    networks:
      - fullstack_network
    depends_on:
      eureka-server:
        condition: service_healthy
      db:
        condition: service_healthy

  accounting-manager-api:
    build:
      context: ./accounting-manager-api
      target: production
    ports:
      - "8010:8080"
    environment:
      <<: *common-env
      HOST_PORT: 8080
      MYSQL_DATABASE: accounting_manager
      SPRING_APP_NAME: AccountingManager
      SPRING_JWT_PUBLIC: /invoices/v3/api-docs,/sales/v3/api-docs,/v3/api-docs/**,/swagger-ui/**,/actuator/**
    networks:
      - fullstack_network
    depends_on:
      eureka-server:
        condition: service_healthy
      db:
        condition: service_healthy

  vet-manager-api:
    build:
      context: ./vet-manager-api
      target: production
    ports:
      - "8011:8080"
    environment:
      <<: *common-env
      HOST_PORT: 8080
      SPRING_APP_NAME: VetManager
      SPRING_JWT_PUBLIC: /appointments/v3/api-docs,/pets/v3/api-docs,/vets/v3/api-docs,/v3/api-docs/**,/swagger-ui/**,/actuator/**
    networks:
      - fullstack_network
    depends_on:
      eureka-server:
        condition: service_healthy
      db:
        condition: service_healthy

  db:
    image: mysql:lts
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - global_mysql_data:/var/lib/mysql
      - mysql_init_volume:/docker-entrypoint-initdb.d
    networks:
      - fullstack_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15m
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8088:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    networks:
      - fullstack_network
    depends_on:
      db:
        condition: service_healthy

volumes:
  global_mysql_data:
  mysql_init_volume:
    name: mysql_init_volume

networks:
  fullstack_network:
    name: fullstack_network
